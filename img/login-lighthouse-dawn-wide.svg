<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 0 1100 600" preserveAspectRatio="xMinYMax slice" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B4BDCA" />
      <stop offset="60%" stop-color="#DCE1E8" />
      <stop offset="100%" stop-color="#F5F6F8" />
    </linearGradient>

    <!-- Beam Gradients -->

    <!-- Glowing Lantern -->
  </defs>

  <!-- Background Sky -->
  <rect x="-200" width="1600" height="600" fill="url(#skyGrad)" />

  <!-- Moon -->
  <circle cx="235" cy="120" r="40" fill="#FFFFFF" opacity="0.9" />
  <circle cx="220" cy="105" r="8" fill="#E4E8ED" opacity="0.3" />
  <circle cx="245" cy="135" r="12" fill="#E4E8ED" opacity="0.3" />
  <circle cx="255" cy="110" r="6" fill="#E4E8ED" opacity="0.3" />

  <!-- Stars with Twinkle Animation -->
  <g fill="#ffffff" opacity="0">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="250" cy="150" r="2" />
    <circle cx="80" cy="220" r="1" />
    <circle cx="450" cy="70" r="2" />
    <circle cx="320" cy="280" r="1.5" />
    <circle cx="550" cy="200" r="1.5" />
    <circle cx="750" cy="160" r="2" />
    <circle cx="710" cy="280" r="1.2" />
  </g>

  <!-- Far Background Waves -->
  <path d="M-200,480 Q-100,460 0,480 T200,480 T400,480 T600,480 T800,480 T1000,480 T1200,480 T1400,480 T1600,480 L1600,600 L-200,600 Z" fill="#DCE1E8">
  </path>

  <!-- Island / Rock Base -->
  <path d="M280,600 L320,490 Q340,470 400,470 Q460,470 480,490 L520,600 Z" fill="#3B4558" />
  <path d="M300,600 L330,510 Q350,490 390,490 L390,600 Z" fill="#5B6576" />

  <!-- Lighthouse Base and Body -->
  <!-- Main white body -->
  <polygon points="360,480 440,480 420,200 380,200" fill="#FFFFFF" />
  
  <!-- Red Stripes -->
  <polygon points="368,400 432,400 426,330 374,330" fill="#24406E" />
  <polygon points="376,260 424,260 418,200 382,200" fill="#24406E" />
  
  <!-- Shadow overlay for cylindrical 3D effect -->
  <polygon points="400,480 440,480 420,200 400,200" fill="#000000" opacity="0.15" />

  <!-- Gallery Deck (Balcony) -->
  <rect x="365" y="190" width="70" height="10" fill="#0E1B33" rx="3" />
  <path d="M365,190 L365,175 M375,190 L375,175 M385,190 L385,175 M395,190 L395,175 M405,190 L405,175 M415,190 L415,175 M425,190 L425,175" stroke="#0E1B33" stroke-width="2" />
  <rect x="360" y="173" width="80" height="3" fill="#0E1B33" />

  <!-- Lantern Room -->
  <polygon points="378,190 422,190 415,135 385,135" fill="#FBF0DB" />
  
  <!-- Lantern Glass Panes (Lines) -->
  <line x1="390" y1="190" x2="393" y2="135" stroke="#0E1B33" stroke-width="3" />
  <line x1="400" y1="190" x2="400" y2="135" stroke="#0E1B33" stroke-width="3" />
  <line x1="410" y1="190" x2="407" y2="135" stroke="#0E1B33" stroke-width="3" />

  <!-- Roof/Dome -->
  <path d="M375,135 Q400,105 425,135 Z" fill="#24406E" />
  <rect x="397" y="100" width="6" height="15" fill="#0E1B33" />
  <circle cx="400" cy="98" r="4" fill="#0E1B33" />
  
  <!-- Roof Shadow -->
  <path d="M400,135 Q412,118 425,135 Z" fill="#000000" opacity="0.2" />

  <!-- Mid-Ground Waves -->
  <path d="M-200,510 Q-100,480 0,510 T200,510 T400,510 T600,510 T800,510 T1000,510 T1200,510 T1400,510 T1600,510 L1600,600 L-200,600 Z" fill="#5B6576" opacity="0.9">
  </path>

  <!-- Foreground Waves -->
  <path d="M-200,550 Q-100,510 0,550 T200,550 T400,550 T600,550 T800,550 T1000,550 T1200,550 T1400,550 T1600,550 L1600,600 L-200,600 Z" fill="#24406E">
  </path>
</svg>
